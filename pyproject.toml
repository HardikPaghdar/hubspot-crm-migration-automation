[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hubspot-crm-migration-automation"
version = "0.1.0"
description = "A safe, CSV-first CRM data quality and HubSpot migration reference toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3.0", "requests>=2.32,<3.0", "python-dotenv>=1.0,<2.0"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.39,<2.0"]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
hubspot-migrate = "hubspot_migration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
