<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#fff"/><text x="42" y="52" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#123c2b">Migration workflow</text><text x="42" y="83" font-family="Arial,sans-serif" font-size="14" fill="#536b5e">A review-first pipeline with explicit approval before live writes.</text><g font-family="Arial,sans-serif"><g><rect x="42" y="135" width="205" height="150" rx="14" fill="#f5f8f6" stroke="#cbded1"/><circle cx="76" cy="170" r="18" fill="#d9f5e5"/><text x="76" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#087443">1</text><text x="68" y="215" font-size="18" font-weight="700" fill="#173d2c">Import CSV</text><text x="68" y="242" font-size="13" fill="#536b5e">Source export</text></g><path d="M252 210 H282" stroke="#789c87" stroke-width="3"/><path d="M274 202 L284 210 L274 218" fill="none" stroke="#789c87" stroke-width="3"/><g><rect x="290" y="135" width="205" height="150" rx="14" fill="#f5f8f6" stroke="#cbded1"/><circle cx="324" cy="170" r="18" fill="#d9f5e5"/><text x="324" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#087443">2</text><text x="316" y="215" font-size="18" font-weight="700" fill="#173d2c">Normalize</text><text x="316" y="242" font-size="13" fill="#536b5e">Map and clean fields</text></g><path d="M500 210 H530" stroke="#789c87" stroke-width="3"/><path d="M522 202 L532 210 L522 218" fill="none" stroke="#789c87" stroke-width="3"/><g><rect x="538" y="135" width="205" height="150" rx="14" fill="#f5f8f6" stroke="#cbded1"/><circle cx="572" cy="170" r="18" fill="#d9f5e5"/><text x="572" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#087443">3</text><text x="564" y="215" font-size="18" font-weight="700" fill="#173d2c">Validate</text><text x="564" y="242" font-size="13" fill="#536b5e">Reject + deduplicate</text></g><path d="M748 210 H778" stroke="#789c87" stroke-width="3